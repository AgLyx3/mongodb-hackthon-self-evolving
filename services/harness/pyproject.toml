[project]
name = "harness"
version = "0.1.0"
description = "Self-evolving FDE harness: kernel, runtime, evolution loop"
readme = "README.md"
authors = [
    { name = "Yixin Li", email = "liaggie421@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents==0.7.19",
    "fastapi>=0.141.1",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-mongodb>=0.5.0",
    "langgraph-store-mongodb>=0.4.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.17.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
harness = "harness:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
